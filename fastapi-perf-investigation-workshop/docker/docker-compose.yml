services:
  es:
    build:
      context: .
      dockerfile: Dockerfile
      target: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed-runner
    environment:
      - ELASTICSEARCH_URL=http://es:9200
    depends_on:
      - es
    restart: "no"

volumes:
  esdata:
